<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Retro Archive{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1><a href="{{ url_for('home') }}">Retro Archive</a></h1>
      <nav class="primary">
        <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
        <a href="{{ url_for('games_list') }}" class="{{ 'active' if request.endpoint in ['games_list','game_detail','game_new'] }}">Games</a>
        <a href="{{ url_for('backlog_list') }}" class="{{ 'active' if request.endpoint == 'backlog_list' }}">Backlog</a>
        <a href="{{ url_for('stats') }}" class="{{ 'active' if request.endpoint == 'stats' }}">Stats</a>
      </nav>
      <form class="search-form" action="{{ url_for('games_list') }}" method="get">
        <input type="text" name="q" placeholder="Search titles…" value="{{ request.args.get('q','') }}">
        <button type="submit" class="secondary">Search</button>
      </form>
    </div>
  </header>

  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
