# Retro Archive via Docker Compose.
#
#   cp .env.example .env      # then edit as needed
#   docker compose up -d --build
#
# Then browse to http://<this-machine's-LAN-IP>:<RETRO_PORT> from any PC on
# your network (or http://localhost:<RETRO_PORT> on this machine).
#
# Values like ${RETRO_PORT} come from .env next to this file; the part after
# ":-" is the default used when .env doesn't set it.

services:
  retro-archive:
    build: .
    image: retro-archive:latest
    container_name: retro-archive
    restart: unless-stopped

    # Run as your own user so files written to ./data stay owned by you.
    # Find your ids with `id -u` / `id -g` (Docker Desktop on Mac/Windows can
    # leave these at the defaults).
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      # host address : host port : container port (always 5050 inside).
      # RETRO_BIND_ADDRESS=0.0.0.0 -> reachable from other machines on the LAN.
      # RETRO_BIND_ADDRESS=127.0.0.1 -> this machine only.
      - "${RETRO_BIND_ADDRESS:-0.0.0.0}:${RETRO_PORT:-5050}:5050"

    environment:
      RETRO_HOST: "0.0.0.0"   # inside the container; leave as is
      RETRO_PORT: "5050"      # inside the container; change RETRO_PORT in .env instead
      RETRO_DATA_DIR: "/data"
      RETRO_SECRET_KEY: "${RETRO_SECRET_KEY:-}"
      RETRO_TRUSTED_ORIGINS: "${RETRO_TRUSTED_ORIGINS:-}"
      RETRO_MAX_UPLOAD_MB: "${RETRO_MAX_UPLOAD_MB:-64}"
      TZ: "${TZ:-UTC}"

    volumes:
      # Database, cover art and the save vault. Back up this folder.
      - "${RETRO_DATA_PATH:-./data}:/data"
      # Your game files, read-only. Inside the app, enter copy paths as
      # /library/... (e.g. /library/SNES/Chrono Trigger (USA).sfc).
      - "${RETRO_LIBRARY_DIR:-./library}:/library:ro"
