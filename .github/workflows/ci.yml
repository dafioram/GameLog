name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the python:3.12-slim base image in the Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

  image:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t retro-archive:ci .

      # Starts the real image through its entrypoint and waits for the same
      # /healthz endpoint the Dockerfile HEALTHCHECK uses. Catches broken
      # Dockerfile, entrypoint or line-ending problems that unit tests miss.
      - name: Start container and check /healthz
        run: |
          docker run -d --name ra -p 5050:5050 retro-archive:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not respond in time" >&2
          docker logs ra >&2
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f ra || true
